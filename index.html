</head>
<body>

<header>
    <h1>🔥 FYP<span>News</span></h1>

</header>

<div class="container">

    <!-- Area Semua Berita Terbaru -->
    <h2>Berita Terbaru</h2>

    <div id="konten-semua"></div>
</div>

<script>
  // GANTI DENGAN URL & KEY SUPABASE ASLI ANDA
const SUPABASE_URL = "https://mqxpzsnunxfpizajvsrd.supabase.co";
const SUPABASE_KEY = "sb_secret_Xc-d0IxQ-NgbzRSiJS3E5w_8VbQiMCP";

const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`
};

// 1. Ambil Berita FYP (Views Terbanyak)
async function ambilBeritaFYP() {
    try {
        const respon = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&order=views.desc&limit=2`, { headers });
        if (!respon.ok) throw new Error("Respon server bermasalah");
        
        const data = await respon.json();
        document.getElementById('loading-fyp').style.display = 'none';
        
        let html = '';
        if (data.length === 0) {
            document.getElementById('konten-fyp').innerHTML = "<p>Belum ada tren FYP saat ini.</p>";
            return;
        }
        data.forEach(berita => {
            html += `
                <div class="card">
                    <span class="badge">🔥 ${berita.views || 0} Klik</span>
                    <h3>${berita.title || 'Tanpa Judul'}</h3>
                    <a href="baca.html?id=${berita.id}" class="btn">Baca Berita</a>
                </div>
            `;
        });
        document.getElementById('konten-fyp').innerHTML = html;
    } catch (error) {
        console.error(error);
        document.getElementById('loading-fyp').innerHTML = `<span style="color:red;">Gagal memuat tren FYP: ${error.message}</span>`;
    }
}

// 2. Ambil Semua Berita Terbaru
async function ambilSemuaBerita() {
    try {
        const respon = await fetch(`${SUPABASE_URL}/rest/v1/articles?select=*&order=created_at.desc`, { headers });
        if (!respon.ok) throw new Error("Respon server bermasalah");

        const data = await respon.json();
        document.getElementById('loading-semua').style.display = 'none';
        
        let html = '';
        if(data.length === 0) {
            document.getElementById('konten-semua').innerHTML = '<p>Belum ada berita terbaru yang diterbitkan.</p>';
            return;
        }
        data.forEach(berita => {
            html += `
                <div class="card">
                    <span class="badge" style="background:#333">${berita.category || 'Umum'}</span>
                    <h3>${berita.title || 'Tanpa Judul'}</h3>
                    <p>${berita.content ? berita.content.substring(0, 100) : ''}...</p>
                    <a href="baca.html?id=${berita.id}" class="btn">Selengkapnya</a>
                </div>
            `;
        });
        document.getElementById('konten-semua').innerHTML = html;
    } catch (error) {
        console.error(error);
        document.getElementById('loading-semua').innerHTML = `<span style="color:red;">Gagal memuat berita: ${error.message}</span>`;
    }
}

// Jalankan fungsi otomatis
ambilBeritaFYP();
ambilSemuaBerita();
